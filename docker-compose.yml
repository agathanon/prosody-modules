# Local Prosody 13.0 instance for developing and testing modules.
# Usage: docker compose up -d   |   Logs: docker compose logs -f prosody
services:
  prosody:
    image: prosodyim/prosody:13.0
    environment:
      PROSODY_VIRTUAL_HOSTS: localhost
      PROSODY_ADMINS: admin@localhost
      PROSODY_LOGLEVEL: debug
      PROSODY_PLUGIN_PATHS: /opt/xmpp-modules
      # Comma-separated list of modules under test
      PROSODY_ENABLE_MODULES: recovery_email,recovery_email_notify,recovery_email_reset,smtp_async
    volumes:
      - .:/opt/xmpp-modules:ro          # this repo, as the plugin path
      - prosody-data:/var/lib/prosody   # test data; wipe with: docker compose down -v
      - ./dev/smtp.cfg.lua:/etc/prosody/conf.d/smtp.cfg.lua:ro
      - ./dev/http.cfg.lua:/etc/prosody/conf.d/http.cfg.lua:ro
    ports:
      - "127.0.0.1:5222:5222"           # local clients only (e.g. Gajim)
      - "127.0.0.1:5280:5280"           # HTTP, e.g. the password reset pages
    depends_on:
      - mailpit

  # Catches all email sent by the dev server; read it at http://127.0.0.1:8025
  mailpit:
    image: axllent/mailpit:v1.31
    command: --smtp-disable-rdns
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  prosody-data:
